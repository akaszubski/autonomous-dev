name: CI

# Continuous Integration - runs on every push and PR
# Ensures code quality and catches regressions before merge

on:
  push:
    branches: [master, main]
    paths-ignore:
      # Telemetry-only commits don't change tested code — skip CI to avoid
      # noise from cloud-drain FIRE_START/FIRE_END pushes every ~2h.
      - '.claude/logs/cloud-runs.jsonl'
      - '.claude/logs/**'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Defer-not-cancel: if a CI run is already in progress for this branch,
# new pushes queue up rather than kill the running job. Matches the
# user-stated intent "if something is running we don't run again".
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Stage 1: Fast smoke tests (fail fast)
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'plugins/autonomous-dev/requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest-timeout (Issue #1567): required before any --timeout flag
          # below — pytest hard-errors on an unrecognized argument.
          pip install pytest pyyaml anthropic pytest-timeout

      - name: Validate test categorization
        run: |
          echo "Validating test categorization..."
          python scripts/validate_test_categorization.py --report

      - name: Validate hook sidecar consistency
        run: |
          echo "Validating hook registration consistency..."
          pip install jsonschema -q
          python scripts/generate_hook_config.py --check \
            --hooks-dir plugins/autonomous-dev/hooks \
            --manifest-path plugins/autonomous-dev/config/install_manifest.json \
            --settings-path plugins/autonomous-dev/config/global_settings_template.json \
            --schema-path plugins/autonomous-dev/config/hook-metadata.schema.json

      # --timeout=30, not 300 (Issue #1567): this job's cap is 5 min = 300s, so
      # a 300s per-test bound races the job cancellation and can never fire —
      # a decoration that reads as protection. 30s is 6x the smoke tier's
      # documented 5s max (tier_registry.py) and 1/10th of the job cap, so a
      # hang names itself with ~270s of budget left to report it.
      - name: Run smoke tests
        run: |
          echo "Running smoke tests (fast sanity check)..."
          python -m pytest tests/regression/smoke/ -v --tb=short -o "addopts=" --timeout=30 --timeout-method=signal

      - name: Validate manifest-doc alignment
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "Validating documentation matches install_manifest.json..."
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "Using GenAI validation via OpenRouter (Gemini Flash)"
            pip install openai -q
            python -c "from plugins.autonomous_dev.lib.hybrid_validator import validate_manifest_alignment; import sys; result = validate_manifest_alignment('.'); sys.exit(result.get_exit_code())"
          else
            echo "Skipping manifest-doc alignment (no OPENROUTER_API_KEY secret set)."
            echo "Fallback regex validator was removed 2026-03-20 (commit 494a378)."
            echo "To enable: add OPENROUTER_API_KEY repo secret. Skip is intentional, not a failure."
          fi

  # Stage 1.5: GenAI intent validation (semantic, drift-proof)
  #
  # Job-level if can reference vars.* but NOT secrets.* (GitHub Actions rule —
  # secrets are only resolvable in step env, not in job-level conditionals).
  # Enable by setting repo VARIABLE OPENROUTER_API_KEY=true under
  # Settings → Secrets and variables → Actions → Variables.
  genai-validation:
    name: GenAI Intent Tests
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ vars.OPENROUTER_API_KEY != '' }}
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'plugins/autonomous-dev/requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest-timeout (Issue #1567): required before any --timeout flag
          # below — pytest hard-errors on an unrecognized argument.
          pip install pytest openai pyyaml pytest-timeout

      # --timeout=240, not 300 (Issue #1567): this job's cap is 10 min = 600s,
      # so 300s sat exactly on the 0.5 ratio ceiling — legal with zero
      # headroom, and any tightening of timeout-minutes below would have turned
      # CI red with no warning margin. 240s is ratio 0.40.
      #
      # 240 is NOT derived from a tier budget: tests/genai/ has no documented
      # max duration (tier_registry.py records max_duration=None for it). It is
      # chosen as a round value comfortably inside the ceiling while still
      # generous for LLM-judge calls, which are the slowest thing here.
      - name: Run GenAI intent tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GENAI_TESTS: 'true'
        run: |
          echo "Running GenAI intent validation tests..."
          python -m pytest tests/genai/ -v --tb=short -o "addopts=" --timeout=240 --timeout-method=signal

  # Stage 2: Full test suite (only if smoke passes)
  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    needs: smoke
    # The job was never slow — it hung. A single test
    # (test_display_loop_polls_file) span forever in a poll loop, so the job
    # burned its whole budget and was recorded as "cancelled" with no results.
    # Raising the ceiling (15 -> 60 min) only made each failure more expensive.
    # Fixed in #1567; the per-test --timeout below is what makes the next hang
    # name itself instead of cancelling the job.
    timeout-minutes: 60

    steps:
      # id: on the setup steps (Issue #1580) — the three suites below carry
      # `!cancelled()`, which REPLACES GitHub's implicit `success()` gate, so
      # they must name each prerequisite they depend on explicitly. An `id:` is
      # the only way to reference a step from a later `if:`.
      - name: Checkout code
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'plugins/autonomous-dev/requirements-dev.txt'

      # marker= emitted for future use; pytest -m wiring deferred per #1332 (see #1337).
      #
      # Fail direction, verified (Issue #1580): this step FAILS OPEN. Under the
      # Actions default shell (`bash -e`, no pipefail) a crash in the python
      # heredoc leaves grep with no match, so grep exits 1 and NOTHING is
      # appended to $GITHUB_OUTPUT (measured: 0 bytes). `skip_all` is then
      # unset, and per GitHub's expression rules an absent output is Null/'' —
      # neither equals 'true' — so `skip_all != 'true'` is TRUE and every suite
      # runs. `continue-on-error: true` keeps the step's CONCLUSION `success`,
      # so the implicit `success()` on later steps is not tripped either.
      # A broken router therefore runs all tests rather than presenting a green
      # CI run that executed nothing.
      - name: Route tests
        id: route
        run: |
          python3 -c "
          import sys, os
          sys.path.insert(0, 'plugins/autonomous-dev/lib')
          from test_routing import route_tests
          r = route_tests()
          skip_all = 'true' if r.get('skip_all') else 'false'
          marker = r.get('marker_expression', '')
          print(f'skip_all={skip_all}')
          print(f'marker={marker}')
          print(f'categories={sorted(r.get(\"categories\", []))}')
          " | tee /dev/stderr | grep -E '^skip_all=|^marker=' >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # The OPPOSITE fail direction to `route` above, deliberately (Issue
      # #1580). `route` fails OPEN because a broken router must not silence the
      # suites. This step must fail CLOSED: if the install breaks, every test
      # in all three suites raises ModuleNotFoundError or the step dies with
      # "pytest: command not found", and that output is indistinguishable in
      # the log from genuine test failures. #1579 records that 77 of the 237
      # current unit failures ALREADY are missing-dependency import errors, so
      # real import noise and fake import noise would be unseparable by eye.
      # One predecessor must not gate; the other must.
      - name: Install dependencies
        id: install
        if: steps.route.outputs.skip_all != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml pytest-xdist pytest-timeout

      # --timeout=300 --timeout-method=signal (Issue #1567): a hung test fails
      # by name with a stack trace and the rest of the suite still runs.
      # signal, not thread: thread kills the whole pytest process, which
      # reproduces the "no results at all" failure this is meant to end.
      #
      # `!cancelled() &&` (Issue #1580): the three suites below are INDEPENDENT
      # and must all report. GitHub applies a default status check of
      # `success()` to any `if:` that contains no status-check function, so the
      # bare `steps.route.outputs.skip_all != 'true'` these steps used to carry
      # meant a red unit step silently SKIPPED integration and regression. Run
      # 32333848238 recorded exactly that: unit failed with 237 failures,
      # integration and regression = "skipped". #1567 removed the hang and we
      # still could not see two thirds of the surface — different mechanism,
      # same absence where a signal should be.
      #
      # `!cancelled()`, not `always()`: GitHub's own docs name `!cancelled()`
      # the recommended alternative, because `always()` also runs steps after a
      # human cancels the run — burning CI budget and reporting test results
      # for a run somebody deliberately stopped.
      #
      # NOT `continue-on-error: true`: that would let this job report SUCCESS
      # with a red suite underneath. A green check on top of failing tests is
      # strictly worse than no check. Each step below still fails, and still
      # fails the job — only the SUPPRESSION OF LATER STEPS is removed.
      #
      # Applied to unit too, though it is first of the three: two steps
      # (`route`, `Install dependencies`) precede it, so "nothing before it can
      # fail" is exactly the assumption that produced this bug. A uniform rule
      # also survives reordering, whereas an ordering-dependent exemption
      # reopens the hole the moment a step is inserted above.
      #
      # The `steps.<id>.outcome != 'failure'` clauses (Issue #1580): adding
      # `!cancelled()` REMOVED the implicit `success()` these steps previously
      # inherited, and that implicit gate was doing real work — it is what made
      # a failed `Install dependencies` skip all three suites. Every
      # prerequisite that must still gate is therefore named back explicitly.
      # Only the ones that must: `route` is absent by design, because it is
      # engineered to fail open (see its comment above).
      #
      # `outcome`, not `conclusion`: `conclusion` is the value AFTER
      # `continue-on-error` is applied, so if a prerequisite ever gains
      # `continue-on-error: true` its `conclusion` reads `success` while it is
      # in fact broken. `outcome` reports what actually happened either way, so
      # the gate cannot be silently disarmed by a one-line edit elsewhere.
      #
      # `!= 'failure'`, not `== 'success'`: a step's `outcome` is `skipped`
      # when its own `if:` is false — which is exactly what happens to
      # `Install dependencies` when the router sets skip_all. `== 'success'`
      # would treat that skip as a reason to suppress the suites, silently,
      # which is the #1580 disease re-entering through a third door. Gate on
      # the failure case only and let the other clauses speak for themselves.
      - name: Run unit tests
        if: ${{ !cancelled() && steps.checkout.outcome != 'failure' && steps.setup_python.outcome != 'failure' && steps.install.outcome != 'failure' && steps.route.outputs.skip_all != 'true' }}
        run: |
          echo "Running unit tests..."
          python -m pytest tests/unit/ -n auto -v --tb=short -o "addopts=" --ignore=tests/archived/ --timeout=300 --timeout-method=signal

      - name: Run integration tests
        if: ${{ !cancelled() && steps.checkout.outcome != 'failure' && steps.setup_python.outcome != 'failure' && steps.install.outcome != 'failure' && steps.route.outputs.skip_all != 'true' }}
        run: |
          echo "Running integration tests..."
          python -m pytest tests/integration/ -n auto -v --tb=short -o "addopts=" --ignore=tests/archived/ --timeout=300 --timeout-method=signal

      - name: Run regression tests
        if: ${{ !cancelled() && steps.checkout.outcome != 'failure' && steps.setup_python.outcome != 'failure' && steps.install.outcome != 'failure' && steps.route.outputs.skip_all != 'true' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "Running regression tests..."
          python -m pytest tests/regression/ -n auto -v --tb=short -o "addopts=" --ignore=tests/archived/ --timeout=300 --timeout-method=signal

  # Stage 3: Summary
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [smoke, genai-validation, test]
    if: always()

    steps:
      - name: Check results
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$SMOKE_RESULT" != "success" ]; then
            echo "Smoke tests did not pass (status: $SMOKE_RESULT) - blocking merge"
            exit 1
          fi
          if [ "$TEST_RESULT" != "success" ] && [ "$TEST_RESULT" != "skipped" ]; then
            echo "Full test suite did not pass (status: $TEST_RESULT) - blocking merge"
            exit 1
          fi
          echo "All CI checks passed!"
